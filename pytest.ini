
[pytest]
pythonpath = src . tests/playwright-course/registration_form
testpaths = tests
python_files = test_*.py example_*.py nana_*.py *_banana.py
markers =
    smoke3: My version of smoke
    negatives: my negatives
    fire: my Fire
    checkout: My checkout
    hodaya: This is me
    smoke: Big smoke
addopts = --tracing=retain-on-failure
; addopts = -sv
; addopts = --tracing=on
